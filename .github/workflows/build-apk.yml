name: Build QUEST LIFE 5.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: quest-life-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          find_projects() {
            find . \
              -type f \
              -name settings.gradle \
              -not -path './.git/*' \
              -not -path '*/build/*' \
              -print
          }

          mapfile -t PROJECT_FILES < <(find_projects)

          if [ "${#PROJECT_FILES[@]}" -eq 0 ]; then
            ZIP_FILE=""

            if [ -f "./QUEST_LIFE_5_Android_Project.zip" ]; then
              ZIP_FILE="./QUEST_LIFE_5_Android_Project.zip"
            else
              mapfile -t ZIP_FILES < <(
                find . -maxdepth 4 -type f -iname '*.zip' \
                  -not -path './.git/*' -print
              )

              if [ "${#ZIP_FILES[@]}" -eq 1 ]; then
                ZIP_FILE="${ZIP_FILES[0]}"
              elif [ "${#ZIP_FILES[@]}" -gt 1 ]; then
                echo "::error::More than one ZIP found. Keep only the project ZIP or rename it to QUEST_LIFE_5_Android_Project.zip."
                exit 1
              fi
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or project ZIP was found."
              exit 1
            fi

            mkdir -p extracted_project
            unzip -q "$ZIP_FILE" -d extracted_project

            mapfile -t PROJECT_FILES < <(
              find extracted_project -type f \
                -name settings.gradle \
                -not -path '*/build/*' -print
            )
          fi

          VALID_PROJECTS=()

          for FILE in "${PROJECT_FILES[@]}"; do
            DIR=$(dirname "$FILE")

            if [ -f "$DIR/app/build.gradle" ] && \
               [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              VALID_PROJECTS+=("$DIR")
            fi
          done

          if [ "${#VALID_PROJECTS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one valid Android project, found ${#VALID_PROJECTS[@]}."
            printf '%s\n' "${VALID_PROJECTS[@]}"
            exit 1
          fi

          PROJECT_DIR="${VALID_PROJECTS[0]}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/questlife/app/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "com.android.application" \
            "$PROJECT_DIR/build.gradle"

          grep -q "8.7.3" "$PROJECT_DIR/build.gradle"

          echo "All required project files were found."

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK Manager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -p "$PROJECT_DIR" \
            :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK file is empty."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK successfully generated."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-5-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: QUEST-LIFE-5-BUILD-REPORTS
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
          
